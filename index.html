<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вадим Лосев | Психолог и гештальт-терапевт</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #fdfdfd; 
            --txt: #2c3e50; 
            --acc: #5a7d9a; 
            --card: #ffffff; 
            --sec: #576574; 
        }
        
        body { 
            font-family: 'Lora', serif; 
            background: var(--bg); 
            color: var(--txt); 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
            -webkit-font-smoothing: antialiased;
        }

        .container { 
            max-width: 480px; 
            width: 100%; 
            background: var(--card); 
            padding: 50px 40px; 
            border-radius: 2px; /* Убрал сильное скругление для более строгого вида */
            box-shadow: 0 4px 20px rgba(0,0,0,0.03); 
            text-align: center;
            border: 1px solid #f0f0f0;
        }

        h1 { 
            font-size: 28px; 
            margin: 0 0 10px; 
            font-weight: 500; 
            letter-spacing: 0.5px;
        }

        .subtitle { 
            color: var(--acc); 
            font-size: 16px; 
            font-style: italic;
            margin-bottom: 35px; 
        }

        .bio { 
            font-size: 17px; 
            line-height: 1.7; 
            color: var(--txt); 
            margin-bottom: 30px; 
            text-align: center; /* Центрировал для гармонии */
        }

        ul { 
            text-align: left; 
            margin: 0 auto 35px; 
            padding: 0; 
            list-style: none;
            max-width: 90%;
        }

        li { 
            font-size: 15px; 
            margin-bottom: 15px; 
            padding-left: 25px; 
            position: relative; 
            line-height: 1.5;
            color: var(--sec);
        }

        li::before { 
            content: "—"; 
            color: var(--acc); 
            position: absolute; 
            left: 0; 
        }

        .tag { 
            display: inline-block; 
            border-bottom: 1px solid var(--acc);
            padding-bottom: 3px;
            font-size: 14px; 
            color: var(--sec); 
            margin-bottom: 40px; 
        }

        .btn { 
            display: block; 
            background: var(--acc); 
            color: white; 
            text-decoration: none; 
            padding: 20px; 
            font-size: 16px;
            font-weight: 500;
            transition: 0.4s; 
            letter-spacing: 1px;
        }

        .btn:hover { 
            background: #46627a; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

                <ul>

            <li>Обучение гештальт-терапии у Жан-Мари Робина, 160 учебных часов (2023-2025)</li>
        </ul>
