<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вадим Лосев | Психолог</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lora&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f8f9fa; --txt: #2d3436; --acc: #5a7d9a; --card: #ffffff; --sec: #636e72; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--txt); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { max-width: 400px; width: 100%; background: var(--card); padding: 35px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
        h1 { font-family: 'Lora', serif; font-size: 24px; margin: 0 0 5px; font-weight: 500; }
        .subtitle { color: var(--acc); font-size: 15px; font-weight: 600; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        .bio { font-size: 15px; line-height: 1.5; color: var(--sec); margin-bottom: 20px; text-align: left; }
        ul { text-align: left; margin: 0 0 25px; padding: 0; list-style: none; }
        li { font-size: 14px; margin-bottom: 10px; padding-left: 20px; position: relative; }
        li::before { content: "•"; color: var(--acc); position: absolute; left: 0; }
        .tag { display: inline-block; background: #e9ecef; padding: 6px 14px; border-radius: 20px; font-size: 12px; color: var(--sec); margin-bottom: 25px; }
        .btn { display: block; background: var(--acc); color: white; text-decoration: none; padding: 16px; border-radius: 12px; font-weight: 600; transition: 0.3s; }
        .btn:hover { background: #4a6a85; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Вадим Лосев</h1>
        <div class="subtitle">Гештальт-терапевт</div>
        <ul>
            <li>Бакалавриат МИП (2020-2025)</li>
            <li>II ступень МИГИП (2020-2024)</li>
            <li>Курс Жан-Мари Робина, 160 ч. (2023-2025)</li>
        </ul>
        <div class="tag">📍 Онлайн из Израиля</div>
        <a href="https://t.me/talkwithvadim" class="btn">Написать в Telegram</a>
    </div>
</body>
</html>
